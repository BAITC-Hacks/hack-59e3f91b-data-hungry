[project]
name = "ekt-assistant"
version = "0.1.0"
description = "AI shopping assistant for ekt.kz (Hackalem AI, case: Электрокомплект)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.60",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "pillow>=10.0",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
